name: Ring Node Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ring-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Ring CLI tests
        run: npm test
