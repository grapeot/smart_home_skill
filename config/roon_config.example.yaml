# Copy to config/roon_config.yaml (gitignored) after pairing.
#
# Agent setup flow:
# 1. POST /api/roon/pair/start
# 2. Ask user to Enable the extension in Roon Settings → Extensions
# 3. Poll GET /api/roon/pair/status until authorized=true
# 4. GET /api/roon/zones and GET /api/roon/playlists

core_host: null          # null = discover; or pin e.g. "192.168.1.10"
core_port: 9330
core_id: null            # optional unique_id filter after first pair
extension_id: com.grapeot.smart-home-roon
display_name: Smart Home Roon
display_version: "1.0.0"
publisher: grapeot
email: local@invalid
